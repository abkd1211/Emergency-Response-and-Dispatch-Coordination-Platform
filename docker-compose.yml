version: '3.9'

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  emergency-net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_auth_data:
  postgres_incident_data:
  mongo_dispatch_data:
  mongo_analytics_data:
  mongo_ai_data:
  redis_data:
  rabbitmq_data:

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER:     auth_user
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB:       auth_db
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"      # Exposed for local dev / Prisma Studio
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-incident:
    image: postgres:16-alpine
    container_name: postgres-incident
    restart: unless-stopped
    environment:
      POSTGRES_USER:     incident_user
      POSTGRES_PASSWORD: incident_password
      POSTGRES_DB:       incident_db
    volumes:
      - postgres_incident_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-dispatch:
    image: mongo:7
    container_name: mongo-dispatch
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: dispatch_user
      MONGO_INITDB_ROOT_PASSWORD: dispatch_password
      MONGO_INITDB_DATABASE:      dispatch_db
    volumes:
      - mongo_dispatch_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-analytics:
    image: mongo:7
    container_name: mongo-analytics
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics_user
      MONGO_INITDB_ROOT_PASSWORD: analytics_password
      MONGO_INITDB_DATABASE:      analytics_db
    volumes:
      - mongo_analytics_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-ai:
    image: mongo:7
    container_name: mongo-ai
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ai_user
      MONGO_INITDB_ROOT_PASSWORD: ai_password
      MONGO_INITDB_DATABASE:      ai_db
    volumes:
      - mongo_ai_data:/data/db
    ports:
      - "27019:27017"
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rmq_user
      RABBITMQ_DEFAULT_PASS: rmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV:                development
      PORT:                    3001
      SERVICE_NAME:            auth-service
      DATABASE_URL:            postgresql://auth_user:auth_password@postgres-auth:5432/auth_db
      REDIS_URL:               redis://redis:6379
      JWT_ACCESS_SECRET:       ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-chars}
      JWT_REFRESH_SECRET:      ${JWT_REFRESH_SECRET:-change-me-refresh-secret-at-least-32-chars}
      JWT_ACCESS_EXPIRES_IN:   15m
      JWT_REFRESH_EXPIRES_IN:  7d
      BCRYPT_SALT_ROUNDS:      12
      RATE_LIMIT_WINDOW_MS:    900000
      RATE_LIMIT_MAX_REQUESTS: 100
      AUTH_RATE_LIMIT_MAX:     10
      ALLOWED_ORIGINS:         http://localhost:3000,http://localhost:3100
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-change-me-internal-secret}
    ports:
      - "3001:3001"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emergency-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

